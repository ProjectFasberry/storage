name: Make package public

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm access set status=public @projectfasberry/storage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
